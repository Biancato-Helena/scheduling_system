<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/Agendar.css">
    <title>Página de agendamentos</title>
</head>
<body>
    
    <h1 class="titulo">Agendamento de Serviços</h1>
    <p class="subtitulo">Preencha o formulário abaixo para agendar seu serviço</p>

    <form class="formulario" action="processar_agendamento.php" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required>

        <label for="data">Data do Agendamento:</label>
        <input type="date" id="data" name="data" required>

        <label for="hora">Hora do Agendamento:</label>
        <input type="time" id="hora" name="hora" required>

        <label for="servico">Serviço:</label>
        <select id="servico" name="servico" required>
            <option value="">Selecione um serviço</option>
            <option value="corte">Corte de Cabelo</option>
            <option value="manicure">Manicure</option>
            <option value="pedicure">Pedicure</option>
            <!-- Adicione mais opções de serviços conforme necessário -->
        </select>

        <label for="obs">Observações:</label>
        <input type="text" id="obs" name="obs" required>        

        <button type="submit">Agendar</button>

    </form>










</body>
</html>
