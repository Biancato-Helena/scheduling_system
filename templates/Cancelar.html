<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Cancelar.css') }}">
    <title>Cancelamento</title>
</head>
<body>
   
    <header>
        <h1>Cancelar Agendamento</h1>
        <p>Digite o código do agendamento que deseja cancelar</p>
    </header>

    <form action="/cancelar" method="POST">
        <label for="codigo">Código do Agendamento:</label>
        <input type="text" id="codigo" name="codigo" required>

        <button type="submit">Procurar</button>

    </form>
    
    {% if sucesso %}
    <div class="sucesso">
        <p>{{ sucesso }}</p>
    </div>
{% endif %}

    <footer>
        <p>&copy; 2026 Todos os direitos reservados.</p>
    </footer>

</body>
</html>
