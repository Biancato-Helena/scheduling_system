<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Agendar.css') }}">
    <title>Agendamentos</title>
</head>
<body>
    
        <div class="header">
            <h1 class="titulo">Agendamento de Serviços</h1>
            <p class="subtitulo">Preencha o formulário abaixo para agendar seu serviço</p>
        </div>
        <h2 class="info"> Cadastro do Usuário</h2>
    <form class="formulario" action="/agendar" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required>


        <label for="servico">Serviço:</label>
        <select id="servico" name="servico" required>
            <option value="">Selecione um serviço</option>
            <option value="S1">Serviço 1</option>
            <option value="S2">Serviço 2</option>
            <option value="S3">Serviço 3</option>
        </select>

        <label for="obs">Observações:</label>
        <textarea id="obs" name="obs" rows="4" placeholder="Digite suas observações aqui..."></textarea>        

        <a href="{{ url_for('calendario')}}" class="botao" type="submit">Continuar agendamento</a>

    </form>

    <div id="código"></div>

        <footer>
            <p>&copy; 2026 Todos os direitos reservados.</p>
        </footer>






<script src="{{ url_for('static', filename='js/Agendar.js') }}"></script>


</body>
</html>
